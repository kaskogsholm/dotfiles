[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glove80-flash"
version = "0.1.0"
description = "Event-driven Glove80 firmware flashing utility"
requires-python = ">=3.11"
dependencies = [
  "pyudev>=0.24,<1",
  "trio>=0.30,<1",
]

[project.scripts]
glove80-flash = "glove80_flash.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/glove80_flash"]
