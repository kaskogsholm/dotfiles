- defaults:
    link:
      relink: true
      force: true
      create: true
- clean: ['~']

- link:
    ~/.zshrc: .zshrc
    ~/.gitconfig: .gitconfig
    ~/.p10k.zsh: .p10k.zsh
    ~/.config/nvim: neovim_config
    ~/.config/wezterm: wezterm
    ~/.config/yazi: yazi
    ~/.config/glove80: glove80

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [fzf/install --all]
  - [curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y]
  - [. "$HOME/.cargo/env"]
  - [rustup update]
  - [cargo install --force yazi-build]
  - [pipx install --force --editable "$HOME/dotfiles/glove80", Installing Glove80 flashing utility]
